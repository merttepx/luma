name: Publish Luma Chat release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luma-windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate version when triggered by a tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Release tag must be v$version" }

      - name: Create or validate the version tag for branch releases
        if: github.ref_type == 'branch'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $remote = git ls-remote --tags origin "refs/tags/$tag"
          if ($remote) {
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
          } else {
            git tag $tag
            git push origin $tag
          }

      - name: Build the Windows installer and updater manifest
        run: pnpm run build:win

      - name: Publish all release files together
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $installer = "installer/Luma-Chat-Setup-$version.exe"
          $blockmap = "$installer.blockmap"
          $manifest = "installer/latest.yml"
          foreach ($file in @($installer, $blockmap, $manifest)) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Release file is missing: $file" }
          }
          $releases = gh api "repos/merttepx/luma/releases?per_page=100" | ConvertFrom-Json
          foreach ($release in @($releases | Where-Object { $_.tag_name -eq $tag })) {
            gh api --method DELETE "repos/merttepx/luma/releases/$($release.id)"
            if ($LASTEXITCODE -ne 0) { throw "Could not replace existing release $($release.id)." }
          }
          gh release create $tag $installer $blockmap $manifest --title "Luma Chat $version" --notes "Luma Chat $version for Windows. All installer and update metadata files are published together."
